# Fly's own Terraform provider is discontinued (see Phase 16 decision) —
# this file IS the infra-as-code artifact for this project, not a
# Terraform module. `app` isn't registered on Fly yet; that happens via
# `fly launch`/`fly apps create` in Phase 17 (define here, deploy there).
app = "aqlis"

# Same region as Neon ("aqlis", Phase 4) — co-locating compute with the
# database keeps every query round-trip local instead of crossing the
# Atlantic on every request.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once, inside the deployed image, before new machines start
  # serving traffic — the home for schema migrations decided back when
  # the Dockerfile copied prisma/ + prisma.config.ts into the runtime
  # image specifically for this. Working directory is the image's own
  # WORKDIR (apps/server), so schema/migrations resolve the same way
  # they do locally.
  release_command = "npx prisma migrate deploy"

# One Fly app, four process groups sharing the same image — not four
# separate apps. `api` serves HTTP; the other three are long-running
# workers with no inbound traffic, so only `api` gets an [http_service]
# below.
[processes]
  api = "node dist/index.js"
  worker-price = "node dist/workers/price-worker.js"
  worker-fundamentals = "node dist/workers/fundamentals-worker.js"
  worker-consumer = "node dist/workers/consumer-worker.js"

[http_service]
  internal_port = 3000
  force_https = true
  processes = ["api"]

  # Always at least one warm API machine — deliberately NOT
  # scale-to-zero (Fly's usual cost-minimizing default). This project
  # exists to be clicked on cold by a hiring manager; a multi-second
  # cold-start on first load is a worse first impression than the
  # ~£1-3/month this costs (already an accepted cost per Phase 2). The
  # three workers below aren't HTTP-triggered, so this auto-stop/start
  # machinery doesn't apply to them at all — their machine counts get
  # set at deploy time in Phase 17.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Single check on /health/ready, not /health — readiness (can this
  # instance reach Postgres/Redis) already implies liveness, so a
  # second check against the bare liveness endpoint would just be
  # redundant. Generous grace_period/timeout: Neon's free-tier database
  # scales to zero when idle (Phase 4), and a cold Postgres wake can
  # take a few seconds — a tight check here risks Fly deciding a
  # perfectly healthy machine is unhealthy before Neon finishes waking
  # up. NOT yet verified against a real deploy (Phase 17 is where this
  # gets proven, not assumed) — worth watching the actual cold-start
  # timing there and loosening further if needed.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/health/ready"

# Smallest paid tier (Phase 2 cost analysis) applied to every process —
# a portfolio project's ingestion workers don't need more than this.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["api", "worker-price", "worker-fundamentals", "worker-consumer"]
