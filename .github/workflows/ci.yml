name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated code, correctly .gitignored — it
      # must be regenerated on every fresh checkout, before anything
      # that needs its types (lint's type-aware rules, typecheck, and
      # runtime imports in tests). Schema-only: needs no DB connection,
      # so no secrets required here.
      - run: npm run generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Last, not first: bundling is the most expensive step, and
      # lint/typecheck/test already catch most real bugs faster and
      # cheaper — same fail-fast ordering as the rest of this pipeline.
      # Only apps/web has a real build script today; apps/server's
      # production build is deliberately deferred to the Docker phase
      # (Phase 17) — see ADR/deferred item ⑥, nothing to verify yet
      # without emit config that nothing consumes.
      - run: npm run build
